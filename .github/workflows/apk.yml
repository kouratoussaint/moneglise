# Compilation automatique de l'APK signé
# - à chaque envoi sur main : APK disponible dans l'onglet Actions (artefact)
# - à chaque étiquette v* (ex. v1.0-build21) : Release GitHub créée avec l'APK joint
# - à chaque envoi sur main dont le message contient [version] : étiquette v1.0-buildN et Release créées ici
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Code de l'application : analyse statique (variables non définies, règles React) et compilation web
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Analyse statique
        run: npm run lint
      - name: Compilation de l'application web
        run: npm run build

  # 2. Règles de sécurité du serveur, testées sur une base PostgreSQL neuve
  serveur:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e360test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: e360test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install psycopg2-binary
      - name: Tests de sécurité du serveur
        run: npm run test:serveur

  # 3. APK signé, seulement si les vérifications réussissent
  apk:
    needs: [verifications, serveur]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dépendances et application web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Clé de signature (depuis les Secrets du dépôt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 manquant (voir README, section Compilation automatique)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/eglise360.keystore
          printf 'storeFile=../eglise360.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=$((20 + ${{ github.run_number }}))

      - name: Nom de l'APK
        id: nom
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then N="MonEglise-${GITHUB_REF_NAME}.apk"; else N="MonEglise-v1.0-build$((20 + ${{ github.run_number }})).apk"; fi
          cp android/app/build/outputs/apk/release/app-release.apk "$N"
          echo "fichier=$N" >> "$GITHUB_OUTPUT"
          echo "etiquette=v1.0-build$((20 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nom.outputs.fichier }}
          path: ${{ steps.nom.outputs.fichier }}
          retention-days: 30

      - name: Release (étiquettes v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.nom.outputs.fichier }}
          generate_release_notes: true

      - name: Release (message [version] sur main)
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[version]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nom.outputs.etiquette }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.nom.outputs.etiquette }}
          files: ${{ steps.nom.outputs.fichier }}
          generate_release_notes: true

      - name: Nettoyage de la clé
        if: always()
        run: rm -f android/eglise360.keystore android/keystore.properties
